apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-reviewer-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-reviewer
  template:
    metadata:
      labels:
        app: ai-reviewer
    spec:
      containers:
      - name: app-container
        image: mhassanulamin/ai-code-reviewer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: gemini-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ai-reviewer-service
spec:
  type: LoadBalancer
  selector:
    app: ai-reviewer
  ports:
    - port: 8000
      targetPort: 8000